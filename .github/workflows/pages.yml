name: Deploy to GitHub Pages

# Publishes the app to GitHub Pages on every push to the default branch.
# One-time setup: repo Settings -> Pages -> "Build and deployment" ->
# Source: "GitHub Actions". After that this runs automatically.

on:
  push:
    branches:
      - claude/golf-trip-scoring-app-o8gv51
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo is the static site (no build step).
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
