<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1B7A3D" />
  <!-- Home-screen app: icons + install manifest -->
  <link rel="icon" type="image/png" href="icons/icon-192.png?v=58" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=58" />
  <link rel="manifest" href="manifest.webmanifest?v=58" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lama" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Lama Palooza 2026</title>
  <meta name="description" content="Live golf scoring — Red vs Blue. Scores, skins, payouts & standings." />
  <!-- Link preview (iMessage / texts / social). Unfurlers read static HTML and
       don't run JS, so this can't auto-switch per tournament — it's a fixed
       title for shared links. Update it when you start a new season. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Lama Palooza" />
  <meta property="og:title" content="Lama Palooza 2026" />
  <meta property="og:description" content="Live golf scoring — Red vs Blue. Scores, skins, payouts & standings." />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Lama Palooza 2026" />
  <meta name="twitter:description" content="Live golf scoring — Red vs Blue. Scores, skins, payouts & standings." />
  <link rel="stylesheet" href="css/tokens.css?v=58" />
  <link rel="stylesheet" href="css/app.css?v=58" />
</head>
<body>
  <div id="app"></div>
  <!-- Firebase (compat) — only used when js/config.js is filled in; otherwise local-only -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script type="module" src="js/app.js?v=58"></script>
</body>
</html>
